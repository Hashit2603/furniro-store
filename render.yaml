databases:
  - name: furniro-db
    databaseName: furniro
    user: furniro
    plan: free

services:
  - type: web
    name: furniro-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: furniro-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        value: 74fcfbba81fe965f51fff977d979c37e
      - key: NEXTAUTH_URL
        value: https://furniro-store.onrender.com
      - key: PORT
        value: "10000"
